  calibrated: false
  roi: *id001
  canny: *id002
  hough_votes: 18
  min_line_pixels: 25
  near_y: 0.53
  far_y: 0.28
  center_x: 0.5
  center_tolerance: 0.07
  heading_tolerance: 0.07
  heading_gain: 0.8
  width_range: *id003
  front_y: *id004
  front_span: 0.35
  min_visible_fraction: 0.65
  min_image_std: 3
  stable_frames: 4
  min_forward_cycles: 3
  turns: *id005
  turn_min_cycles: *id006
  turn_max_cycles: *id007
  endpoint_mode: yellow_cone
  endpoint_min_forward_cycles: 3
  endpoint_stable_frames: 8
  release_at_endpoint: true
  lost_timeout: 3.0
  timeout: 180.0
  settle_seconds: 0.2
  require_panel_support: true
  post_min_height: 20
  post_base_radius: 14
  panel_max_std: 18
  endpoint_hold_seconds: 1.0
  cone: *id008
  branch_gap_y: 0.06
  panel_max_saturation: 120
trial_only: true
