# Example only. Calibrate with the actual object, camera tilt and field.
hardware_calibrated: false
# Select legacy for the inspected 192.168.149.1 robot (official Board, 115200 baud).
# auto only checks module availability; it cannot identify the physical controller.
hardware_backend: legacy
action_dir: /home/pi/TonyPi/ActionGroups
camera: auto
camera_timeout: 2.0
search_timeout: 60.0
approach_action_limit: 80
head: {pan: 1500, tilt: 1500, pan_id: 2, tilt_id: 1}
vision:
  target_color: blue
  # OpenCV HSV: hue 0..179. Starting thresholds; tune on the actual blue block.
  color_space: HSV
  lower_hsv: [95, 70, 40]
  upper_hsv: [135, 255, 255]
  min_area: 0.003
  max_area: 0.50
  center_x: 0.50
  x_tolerance: 0.06
  grab_bottom: 0.88
  grab_area: 0.025
  stable_frames: 6
  stability_tolerance: 0.06
actions:
  approach: go_forward_one_small_step
  align_left: left_move
  align_right: right_move
  grab: grab
  forward: grab_go_forward
  left: grab_turn_left_composed
  right: grab_turn_right_composed
  release: put_down
  # Normal placement uses the robot's put_down. Failed-grasp reset is separate.
  # Candidate reverse-grab reset: validate against the actual failed-grasp pose.
  retry_reset: grab_release
grasp_attempts: 3
feedback:
  verify_carry: true
  # Normalized ROIs: [x0,y0,x1,y1]; REQUIRED calibration before hardware use.
  # Camera must see the carried blue block and the placement surface separately.
  held_roi: null
  placed_roi: null
  roi_min_area: 0.03
  roi_max_area: 0.95
  held: {mode: vision, file: '', timeout: 3.0, max_age: 0.5, stable_samples: 6}
  released: {mode: vision, file: '', timeout: 3.0, max_age: 0.5, stable_samples: 6}
  # Adapter/operator supplies a NEW placement_ready observation after route end.
  placement_ready: {mode: file, file: /tmp/tonypi_placement.json, timeout: 30.0, max_age: 0.5, stable_samples: 3}
obstacle_guard:
  enabled: true
  # Confirmed hardware has camera, no ranging sensor. This is an image guard.
  mode: vision
  roi: null
  # Grey floor prior from the team; tune under actual lighting.
  floor_lower_hsv: [0, 0, 40]
  floor_upper_hsv: [179, 65, 235]
  # Optional blue target interaction region, ignored ONLY in pickup/release phases.
  interaction_roi: null
  contour_fraction: 0.06
  occupancy_fraction: 0.15
  min_visible_fraction: 0.5
  edge_fraction: 0.015
  edge_contour_height: 0.30
  # Retained for optional future mode: distance.
  file: /tmp/tonypi_distance.json
  max_age: 0.3
  # Calibrate for body/arms/load envelope, sensor offset and stopping travel.
  stop_distance_m: 0.30
  poll_seconds: 0.05
hold_arm_servos: [6, 7, 8, 14, 15, 16]
# cycles are action repetitions, NOT meters/degrees. Measure before use.
route:
  - {kind: forward, cycles: 6}
  - {kind: left, cycles: 3}
  - {kind: forward, cycles: 6}
  - {kind: right, cycles: 3}
  - {kind: forward, cycles: 6}
  - {kind: wait, seconds: 1.0}
settle_seconds: 0.8
heartbeat:
  enabled: false
  host: 192.168.1.100
  port: 15000
  session: team1
# Optional external grasp/drop sensor adapter writes "held" or "dropped".
# A nonempty path makes missing/stale/non-held sensor data stop the route.
hold_sensor_file: ''
hold_sensor_timeout: 1.0
