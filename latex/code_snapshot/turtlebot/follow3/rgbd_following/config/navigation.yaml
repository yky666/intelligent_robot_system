# Rolling odom costmaps: live depth input, no static map, gmapping or AMCL.
base_global_planner: navfn/NavfnROS
base_local_planner: dwa_local_planner/DWAPlannerROS
controller_frequency: 10.0
planner_frequency: 2.0
planner_patience: 4.0
controller_patience: 4.0
oscillation_timeout: 10.0
oscillation_distance: 0.1
recovery_behavior_enabled: false
clearing_rotation_allowed: false
shutdown_costmaps: false
NavfnROS:
  allow_unknown: false
  default_tolerance: 0.0
DWAPlannerROS:
  max_vel_x: 0.12
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  # Kinetic dynamic_reconfigure names (later distributions rename these).
  max_trans_vel: 0.12
  min_trans_vel: 0.015
  max_rot_vel: 0.4
  # Must be reachable from rest within acc_lim_theta / controller_frequency.
  min_rot_vel: 0.03
  trans_stopped_vel: 0.015
  rot_stopped_vel: 0.03
  acc_lim_x: 0.3
  acc_lim_y: 0.0
  acc_lim_theta: 0.6
  xy_goal_tolerance: 0.10
  yaw_goal_tolerance: 0.5
  latch_xy_goal_tolerance: true
  sim_time: 2.0
  vx_samples: 12
  vy_samples: 1
  vth_samples: 25
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.1
  stop_time_buffer: 0.3
global_costmap:
  rolling_window: true
  width: 8.0
  height: 8.0
  resolution: 0.05
  update_frequency: 5.0
  publish_frequency: 5.0
local_costmap:
  rolling_window: true
  width: 4.0
  height: 4.0
  resolution: 0.05
  update_frequency: 10.0
  publish_frequency: 5.0
